name: Web404 Security

on:
  push:
    branches: [main, security-hardening-v1.1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run security smoke tests
        run: npm run test:security
